# Same server as upstream but on the unprivileged port, with the SPA fallback
# IT Tools needs for client-side routes such as /base64-string-converter.
server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
