image = 'clickhouse/clickhouse-server:26.6.1.1193@sha256:1d1f6508eba2dccce2cee9913907c5f7766327debc57a6b1991f2c9e3176c163'
port = 0
public_tcp = []
ports = []
public = false
size = 'medium'
replicas = 1
update_strategy = ''
healthcheck = ''
command = ['/bin/bash']
args = ['-c', "set -e\ncp /assets/clickhouse/config.xml /etc/clickhouse-server/config.xml\ncp /assets/clickhouse/config.d/default.xml /etc/clickhouse-server/config.d/default.xml\ncp /assets/clickhouse/users.xml /etc/clickhouse-server/users.xml\ncp /assets/clickhouse/user_defined_function.xml /etc/clickhouse-server/user_defined_function.xml\nmkdir -p /var/lib/clickhouse/format_schemas /var/lib/clickhouse/user_scripts\ncp -r /assets/idl/. /var/lib/clickhouse/format_schemas/\ncp -r /assets/user_scripts/. /var/lib/clickhouse/user_scripts/\nchmod -R 755 /var/lib/clickhouse/user_scripts\nchown -R clickhouse:clickhouse /var/lib/clickhouse/format_schemas /var/lib/clickhouse/user_scripts || true\n# Materialize system log tables (system.crash_log is required by the\n# custom_metrics ClickHouse migration), mirroring upstream init-db.sh\n(\n  i=0\n  while [ $$i -lt 90 ]; do\n    if clickhouse-client --query \"SELECT 1\" >/dev/null 2>&1; then\n      clickhouse-client --query \"SYSTEM FLUSH LOGS\" && echo \"system logs flushed\" && break\n    fi\n    sleep 2\n    i=$$((i+1))\n  done\n) &\nexec /entrypoint.sh\n"]
depends_on = ['init-assets', 'zookeeper', 'kafka']
networks = ['default']
restart_nonce = ''
registry_credential = ''
aws_identity = ''

[[services.clickhouse.mounts]]
volume = 'posthog-assets'
mount_path = '/assets'
read_only = true
sub_path = ''

[[services.clickhouse.mounts]]
