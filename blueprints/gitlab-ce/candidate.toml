schema_version = 1
name = 'template'

[services]
[services.gitlab]
architecture = ''
run_as_user = 0
run_as_group = 0
fs_group = 0
read_only_root_filesystem = false
working_dir = ''
termination_grace_seconds = 0
certificate_mounts = []
temporary_mounts = []
image = 'gitlab/gitlab-ce:19.1.2-ce.0@sha256:ed48f1d320841a393c3b8c3a9558f28117a4ebdbb35538b43a73467aabd9590a'
port = 80
public_tcp = []
ports = []
public = true
size = 'medium'
