[services.gitlab.env]
[services.gitlab.secrets]
[services.gitlab.secrets.GITLAB_OMNIBUS_CONFIG]
ref = 'gitlab-omnibus-config'

[networks]
[networks.default]
internal = false
virtual_network = ''
segment = ''

[volumes]
[volumes.gitlab-data]
size_gib = 5
