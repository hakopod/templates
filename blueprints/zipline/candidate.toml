schema_version = 1
name = 'template'

[services]
[services.postgres]
architecture = ''
run_as_user = 0
run_as_group = 0
fs_group = 0
read_only_root_filesystem = false
working_dir = ''
termination_grace_seconds = 0
certificate_mounts = []
temporary_mounts = []
image = 'postgres:15@sha256:9b1d34adbce1dd07ee6e94b4a2cf698884b89bd44a6c9c12f5da8f3acbfe4957'
port = 5432
public_tcp = []
ports = []
public = false
size = 'medium'
replicas = 1
update_strategy = ''
healthcheck = ''
command = []
args = []
depends_on = []
networks = ['default']
restart_nonce = ''
registry_credential = ''
aws_identity = ''

[[services.postgres.mounts]]
volume = 'pg-data'
mount_path = '/var/lib/postgresql/data'
read_only = false
sub_path = ''

[services.postgres.env]
POSTGRES_DATABASE = 'postgres'
POSTGRES_USER = 'postgres'

[services.postgres.secrets]
[services.postgres.secrets.POSTGRES_PASSWORD]
ref = 'postgres-password'

[services.zipline]
architecture = ''
run_as_user = 0
run_as_group = 0
fs_group = 0
read_only_root_filesystem = false
working_dir = ''
termination_grace_seconds = 0
certificate_mounts = []
mounts = []
temporary_mounts = []
image = 'ghcr.io/diced/zipline:v4@sha256:2340b4cb2094165af3e9b036be5ec445f8fcbf49067ab8ade2135809e37e610d'
port = 3000
public_tcp = []
ports = []
public = true
size = 'medium'
replicas = 1
update_strategy = ''
healthcheck = ''
command = []
args = []
depends_on = ['postgres']
networks = ['default']
restart_nonce = ''
registry_credential = ''
aws_identity = ''

[services.zipline.env]
CORE_HOSTNAME = '0.0.0.0'
CORE_LOGGER = 'true'
CORE_PORT = '3000'
CORE_RETURN_HTTPS = 'false'
DATASOURCE_LOCAL_DIRECTORY = './uploads'
DATASOURCE_TYPE = 'local'

[services.zipline.secrets]
[services.zipline.secrets.CORE_SECRET]
ref = 'core-secret'

[services.zipline.secrets.DATABASE_URL]
ref = 'database-url'

[networks]
[networks.default]
internal = false
virtual_network = ''
segment = ''

[volumes]
[volumes.pg-data]
size_gib = 5
storage_class = ''
access_mode = 'ReadWriteOnce'
