schema_version = 1
name = 'template'

[services]
[services.db]
architecture = ''
run_as_user = 70
run_as_group = 0
fs_group = 0
read_only_root_filesystem = false
working_dir = ''
termination_grace_seconds = 0
certificate_mounts = []
mounts = []
temporary_mounts = []
image = 'docker.io/library/postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73'
port = 5432
public_tcp = []
ports = []
public = false
size = 'medium'
replicas = 1
update_strategy = ''
healthcheck = ''
command = []
args = ['postgres', '-c', 'shared_buffers=64MB', '-c', 'max_connections=50']
depends_on = []
networks = ['default']
restart_nonce = ''
registry_credential = ''
aws_identity = ''

[services.db.volume]
mount_path = '/var/lib/postgresql/data'
size_gib = 5
storage_class = ''

[services.db.env]
PGDATA = '/var/lib/postgresql/data/pgdata'
POSTGRES_DB = 'app'
POSTGRES_USER = 'hakopod'

[services.db.secrets]
[services.db.secrets.POSTGRES_PASSWORD]
ref = 'database-password'

[services.main]
architecture = ''
run_as_user = 1001
run_as_group = 0
fs_group = 0
read_only_root_filesystem = false
working_dir = ''
termination_grace_seconds = 0
certificate_mounts = []
mounts = []
temporary_mounts = []
image = 'ghcr.io/umami-software/umami:3.4.1@sha256:e69d1a7932e9dab0fc523edc7be1f3a53f3c261f57856fc2167ae74a8fc022e8'
port = 3000
public_tcp = []
ports = []
public = true
size = 'small'
replicas = 1
update_strategy = ''
healthcheck = '/api/heartbeat'
command = []
args = []
depends_on = ['db']
networks = ['default']
restart_nonce = ''
registry_credential = ''
aws_identity = ''

[services.main.env]
DISABLE_TELEMETRY = '1'
NODE_ENV = 'production'

[services.main.secrets]
[services.main.secrets.APP_SECRET]
ref = 'app-secret'

# DATABASE_URL embeds the database password, so Hakopod derives it at deploy
# time from the same secret that protects the db service.
[services.main.bindings.DATABASE_URL]
service = 'db'
protocol = 'postgres'
username = 'hakopod'
database = 'app'

[services.main.bindings.DATABASE_URL.password]
ref = 'database-password'

[networks]
[networks.default]
internal = false
virtual_network = ''
segment = ''
