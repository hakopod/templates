schema_version = 1
name = 'template'

[services]
[services.mariadb]
architecture = ''
run_as_user = 0
run_as_group = 0
fs_group = 0
read_only_root_filesystem = false
working_dir = ''
termination_grace_seconds = 0
certificate_mounts = []
temporary_mounts = []
image = 'mariadb:11@sha256:2d2f4095530294735a857cfe22bb101e19b0849b416911c796ec4aa81b164a62'
port = 3306
public_tcp = []
ports = []
public = false
size = 'medium'
replicas = 1
update_strategy = ''
healthcheck = ''
command = []
args = []
depends_on = []
networks = ['default']
restart_nonce = ''
registry_credential = ''
aws_identity = ''

[[services.mariadb.mounts]]
volume = 'passbolt-mariadb-data'
mount_path = '/var/lib/mysql'
read_only = false
sub_path = ''

[services.mariadb.env]
MARIADB_DATABASE = 'passbolt'
MARIADB_USER = 'passbolt'

[services.mariadb.secrets]
[services.mariadb.secrets.MARIADB_PASSWORD]
ref = 'mariadb-password'

[services.mariadb.secrets.MARIADB_ROOT_PASSWORD]
ref = 'mariadb-root-password'

[services.passbolt]
architecture = ''
run_as_user = 0
run_as_group = 0
fs_group = 0
read_only_root_filesystem = false
working_dir = ''
termination_grace_seconds = 0
certificate_mounts = []
mounts = []
temporary_mounts = []
image = 'passbolt/passbolt:latest-ce@sha256:e16ff8720fd721861435518e0a8926f2d41895cca335ba5cd5ba168ae41ae9a9'
port = 80
public_tcp = []
ports = []
public = true
size = 'medium'
replicas = 1
update_strategy = ''
healthcheck = ''
command = []
args = ['/usr/bin/wait-for.sh', '-t', '0', '${PASSBOLT_DB_HOST}:${PASSBOLT_DB_PORT}', '--', '/docker-entrypoint.sh']
depends_on = ['mariadb']
networks = ['default']
restart_nonce = ''
registry_credential = ''
aws_identity = ''

[services.passbolt.env]
APP_FULL_BASE_URL = 'http://{{site_host}}'
DATASOURCES_DEFAULT_DATABASE = 'passbolt'
DATASOURCES_DEFAULT_HOST = 'mariadb'
DATASOURCES_DEFAULT_PORT = '3306'
DATASOURCES_DEFAULT_USERNAME = 'passbolt'
EMAIL_DEFAULT_FROM = 'passbolt@{{site_host}}'
EMAIL_TRANSPORT_DEFAULT_HOST = 'smtp.example.com'
EMAIL_TRANSPORT_DEFAULT_PORT = '587'
EMAIL_TRANSPORT_DEFAULT_TLS = 'true'
EMAIL_TRANSPORT_DEFAULT_USERNAME = 'noreply@example.com'
PASSBOLT_PLUGINS_JWT_AUTHENTICATION_ENABLED = 'true'

[services.passbolt.secrets]
[services.passbolt.secrets.DATASOURCES_DEFAULT_PASSWORD]
ref = 'datasources-default-password'

[services.passbolt.secrets.EMAIL_TRANSPORT_DEFAULT_PASSWORD]
ref = 'email-transport-default-password'

[networks]
[networks.default]
internal = false
virtual_network = ''
segment = ''

[volumes]
[volumes.passbolt-mariadb-data]
size_gib = 5
storage_class = ''
access_mode = 'ReadWriteOnce'
