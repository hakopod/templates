schema_version = 1
name = 'template'

[services]
[services.main]
architecture = ''
run_as_user = 10001
run_as_group = 10001
fs_group = 10001
read_only_root_filesystem = true
working_dir = ''
termination_grace_seconds = 60
certificate_mounts = [{ source = 'ingress', mount_path = '/certificates/smtp' }]
mounts = []
temporary_mounts = [{ mount_path = '/tmp', size_mib = 64 }]
image = 'foxcpp/maddy:0.9.6@sha256:e1074e92a452b84d1135ebe8ab831c5f541d33dcbd39e38fab740a53bbf2f97c'
port = 2587
public_tcp = [{ port = 587, target_port = 2587, source_cidrs = ['0.0.0.0/0'] }]
ports = []
public = false
size = 'small'
replicas = 1
update_strategy = 'recreate'
healthcheck = ''
command = ['/bin/maddy']
args = ['-config', '/etc/maddy/maddy.conf', 'run']
depends_on = []
networks = ['default']
restart_nonce = ''
registry_credential = ''
aws_identity = ''

[services.main.volume]
mount_path = '/data'
size_gib = 2
storage_class = ''

[services.main.env]
MADDY_DELIVERY = '{{config.delivery}}'
MADDY_DOMAIN = '{{config.sender-domain}}'
MADDY_HOSTNAME = '{{config.hostname}}'
MADDY_RELAY = '{{config.relay}}'
MADDY_RELAY_USER = '{{config.relay-user}}'

[services.main.secrets]
[services.main.secrets.MADDY_RELAY_PASSWORD]
ref = 'relay-password'

[services.main.files.config]
mount_path = '/etc/maddy/maddy.conf'
content = "## Hakopod SMTP submission server: send-only, no inbound port 25 or IMAP.\n$(hostname) = {env:MADDY_HOSTNAME}\n$(primary_domain) = {env:MADDY_DOMAIN}\n$(local_domains) = $(primary_domain)\n\nstate_dir /data\nruntime_dir /tmp\nhostname $(hostname)\n# Hakopod mounts the certificate for this service's generated hostname here.\ntls file /certificates/smtp/tls.crt /certificates/smtp/tls.key\n\nauth.pass_table local_authdb {\n    table sql_table {\n        driver sqlite3\n        dsn credentials.db\n        table_name passwords\n    }\n}\n\n# direct.conf delivers to recipients' MX servers; relay.conf sends through a provider.\nimport /etc/maddy/{env:MADDY_DELIVERY}.conf\n\ntarget.queue outbound {\n    target &out\n    autogenerated_msg_domain $(primary_domain)\n    bounce {\n        deliver_to &out\n    }\n}\n\nsubmission tcp://0.0.0.0:2587 {\n    limits {\n        all rate 50 1s\n    }\n    auth &local_authdb\n    source $(local_domains) {\n        check {\n            authorize_sender {\n                user_to_email identity\n            }\n        }\n        default_destination {\n            modify {\n                dkim $(primary_domain) $(local_domains) default\n            }\n            deliver_to &outbound\n        }\n    }\n    default_source {\n        reject 501 5.1.8 \"Non-local sender domain\"\n    }\n}\n"

[services.main.files.direct]
mount_path = '/etc/maddy/direct.conf'
content = "target.remote out {\n    limits {\n        destination rate 20 1s\n        destination concurrency 10\n    }\n    mx_auth {\n        dane\n        mtasts {\n            cache fs\n            fs_dir mtasts_cache/\n        }\n        local_policy {\n            min_tls_level encrypted\n            min_mx_level none\n        }\n    }\n}\n"

[services.main.files.relay]
mount_path = '/etc/maddy/relay.conf'
content = "target.smtp out {\n    attempt_starttls yes\n    require_tls yes\n    auth plain {env:MADDY_RELAY_USER} {env:MADDY_RELAY_PASSWORD}\n    targets {env:MADDY_RELAY}\n}\n"

[networks]
[networks.default]
internal = false
virtual_network = ''
segment = ''
