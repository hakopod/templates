schema_version = 1
name = 'template'

[services]
[services.langflow]
architecture = ''
run_as_user = 0
run_as_group = 0
fs_group = 0
read_only_root_filesystem = false
working_dir = ''
termination_grace_seconds = 0
certificate_mounts = []
temporary_mounts = []
image = 'langflowai/langflow:latest@sha256:3e3cac657435f292fb5da653e8eb05b330460a99f1420e169f29413ba9d11164'
port = 7860
public_tcp = []
ports = []
public = true
size = 'medium'
replicas = 1
update_strategy = ''
healthcheck = ''
command = []
args = []
depends_on = ['postgres-langflow']
networks = ['default']
restart_nonce = ''
registry_credential = ''
aws_identity = ''

[[services.langflow.mounts]]
volume = 'app-data'
mount_path = '/app/langflow'
read_only = false
sub_path = ''

[[services.langflow.mounts]]
volume = 'app-config'
mount_path = '/app/config'
read_only = false
sub_path = ''

[services.langflow.env]
DO_NOT_TRACK = 'True'
LANGFLOW_AUTO_LOGIN = 'False'
LANGFLOW_AUTO_SAVING = 'True'
LANGFLOW_CONFIG_DIR = '/app/config'
LANGFLOW_ENABLE_SUPERUSER_CLI = 'False'
LANGFLOW_NEW_USER_IS_ACTIVE = 'False'
LANGFLOW_SUPERUSER = 'email@domain.com'

[services.langflow.secrets]
[services.langflow.secrets.LANGFLOW_DATABASE_URL]
ref = 'langflow-database-url'

[services.langflow.secrets.LANGFLOW_SECRET_KEY]
ref = 'langflow-secret-key'

[services.langflow.secrets.LANGFLOW_SUPERUSER_PASSWORD]
ref = 'langflow-superuser-password'

[services.postgres-langflow]
architecture = ''
run_as_user = 0
run_as_group = 0
fs_group = 0
read_only_root_filesystem = false
working_dir = ''
termination_grace_seconds = 0
certificate_mounts = []
temporary_mounts = []
image = 'postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94'
port = 5432
public_tcp = []
ports = []
public = false
size = 'medium'
replicas = 1
update_strategy = ''
healthcheck = ''
command = []
args = []
depends_on = []
networks = ['default']
restart_nonce = ''
registry_credential = ''
aws_identity = ''

[[services.postgres-langflow.mounts]]
volume = 'postgres-data'
mount_path = '/var/lib/postgresql/data'
read_only = false
sub_path = ''

[services.postgres-langflow.env]
POSTGRES_DB = 'langflow'
POSTGRES_USER = 'langflow'

[services.postgres-langflow.secrets]
[services.postgres-langflow.secrets.POSTGRES_PASSWORD]
ref = 'postgres-password'

[networks]
[networks.default]
internal = false
virtual_network = ''
segment = ''

[volumes]
[volumes.app-config]
size_gib = 5
storage_class = ''
access_mode = 'ReadWriteOnce'

[volumes.app-data]
size_gib = 5
storage_class = ''
access_mode = 'ReadWriteOnce'

[volumes.postgres-data]
size_gib = 5
storage_class = ''
access_mode = 'ReadWriteOnce'
