schema_version = 1
name = 'template'

[services]
[services.main]
architecture = ''
run_as_user = 1000
run_as_group = 0
fs_group = 0
read_only_root_filesystem = false
working_dir = ''
termination_grace_seconds = 0
certificate_mounts = []
mounts = []
temporary_mounts = []
image = 'docker.io/gitea/gitea:1.27.3-rootless@sha256:1c17ecaead42eb3b5391553d8708103a4beb0e86edf5b9ebc1eb269c318845f2'
port = 3000
public_tcp = []
ports = []
public = true
size = 'medium'
replicas = 1
update_strategy = ''
healthcheck = '/api/healthz'
command = []
args = []
depends_on = []
networks = ['default']
restart_nonce = ''
registry_credential = ''
aws_identity = ''

[services.main.volume]
mount_path = '/var/lib/gitea'
size_gib = 5
storage_class = ''

[services.main.env]
GITEA_APP_INI = '/var/lib/gitea/custom/conf/app.ini'
GITEA__database__DB_TYPE = 'sqlite3'
GITEA__server__DISABLE_SSH = 'true'
GITEA__server__ROOT_URL = 'https://catalog.example.test/'

[networks]
[networks.default]
internal = false
virtual_network = ''
segment = ''
