schema_version = 1
name = 'template'

[services]
[services.main]
architecture = ''
run_as_user = 1000
run_as_group = 0
fs_group = 0
read_only_root_filesystem = false
working_dir = ''
termination_grace_seconds = 0
certificate_mounts = []
mounts = []
temporary_mounts = []
image = 'n8nio/n8n:2.30.4@sha256:d1606a508b1e426de07a98fa10f3758ef474b17590c6f181a0dd38c999f819d0'
port = 5678
public_tcp = []
ports = []
public = true
size = 'compute'
replicas = 1
update_strategy = ''
healthcheck = '/healthz'
command = []
args = []
depends_on = []
networks = ['default']
restart_nonce = ''
registry_credential = ''
aws_identity = ''

[services.main.volume]
mount_path = '/home/node/.n8n'
size_gib = 5
storage_class = ''

[services.main.env]
GENERIC_TIMEZONE = '{{config.timezone}}'
N8N_EDITOR_BASE_URL = 'https://catalog.example.test/'
N8N_HOST = '{{site_host}}'
N8N_PORT = '5678'
N8N_PROTOCOL = 'https'
N8N_PROXY_HOPS = '1'
N8N_SECURE_COOKIE = 'true'
NODE_ENV = 'production'
WEBHOOK_URL = 'https://catalog.example.test/'

[services.main.secrets]
[services.main.secrets.N8N_ENCRYPTION_KEY]
ref = 'encryption-key'

[networks]
[networks.default]
internal = false
virtual_network = ''
segment = ''
