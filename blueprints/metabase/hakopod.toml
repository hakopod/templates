[services.db.secrets]
[services.db.secrets.POSTGRES_PASSWORD]
ref = 'database-password'

[services.main]
architecture = ''
run_as_user = 2000
run_as_group = 0
fs_group = 0
read_only_root_filesystem = false
working_dir = ''
termination_grace_seconds = 0
certificate_mounts = []
mounts = []
temporary_mounts = []
image = 'docker.io/metabase/metabase:v0.63.17@sha256:918187453bd5d70849d14bb6af0bb482a617dc849f251502679a8e626d98f4ee'
port = 3000
public_tcp = []
ports = []
public = true
size = 'compute'
replicas = 1
update_strategy = ''
healthcheck = '/api/health'
command = []
args = []
depends_on = ['db']
networks = ['default']
restart_nonce = ''
registry_credential = ''
aws_identity = ''

[services.main.volume]
mount_path = '/data'
size_gib = 5
storage_class = ''

[services.main.env]
JAVA_TOOL_OPTIONS = '-Xmx1024m -XX:ActiveProcessorCount=2'
MB_DB_DBNAME = 'app'
MB_DB_HOST = 'db'
MB_DB_PORT = '5432'
MB_DB_TYPE = 'postgres'
MB_DB_USER = 'hakopod'
MB_PLUGINS_DIR = '/data/plugins'
MB_SITE_URL = 'https://catalog.example.test'

[services.main.secrets]
[services.main.secrets.MB_DB_PASS]
ref = 'database-password'

[services.main.secrets.MB_ENCRYPTION_SECRET_KEY]
ref = 'credential-encryption-key'

