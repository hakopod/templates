schema_version = 1
name = 'template'

[services]
[services.main]
architecture = ''
run_as_user = 65532
run_as_group = 65532
fs_group = 65532
read_only_root_filesystem = true
working_dir = ''
termination_grace_seconds = 30
certificate_mounts = []
temporary_mounts = []
image = 'ghcr.io/synehq/synehq-oos:sha-ed0976531fb244bfab04c532e463858086609889-hakopod@sha256:4770e40aff68d64555ac69bd91854cdb220f4874979d2493c4baf63b76a9a8f6'
port = 3100
public_tcp = []
ports = []
public = true
size = 'medium'
replicas = 1
update_strategy = ''
healthcheck = ''
command = []
args = []
depends_on = []
networks = ['default']
restart_nonce = ''
registry_credential = ''
aws_identity = ''

[[services.main.mounts]]
volume = 'data'
mount_path = '/data'
read_only = false
sub_path = ''

[services.main.env]
OOS_BASE_PATH = '/synehq'
AUTH_URL = 'https://catalog.example.test'
OOS_HAKOPOD_SCOPE = '{{config.name}}'
OOS_HAKOPOD_KEY_FILE = '/data/runtime/keys/hakopod.key'
OOS_HAKOPOD_AUTHORITY_URL = 'https://catalog.example.test/internal/database-explorer/authorize'

[services.main.secrets]
[services.main.secrets.OOS_HAKOPOD_KEY]
ref = 'hakopod-explorer-key'

[networks]
[networks.default]
internal = false
virtual_network = ''
segment = ''

[volumes]
[volumes.data]
size_gib = 5
storage_class = ''
access_mode = 'ReadWriteOnce'
