schema_version = 1
name = 'template'

[services]
[services.main]
architecture = ''
run_as_user = 65532
run_as_group = 65532
fs_group = 65532
read_only_root_filesystem = true
working_dir = ''
termination_grace_seconds = 90
certificate_mounts = []
image = 'ghcr.io/synehq/synehq-oos:sha-d280c7cb3181e4342c89986e38edd35da38c45bf-hakopod@sha256:291f5417382dc9fe462c7566621226c0d6bbaa5bfcb7c7cd83b3e10bbbd3e6e5'
port = 3100
public_tcp = []
ports = []
public = true
size = 'medium'
replicas = 1
update_strategy = ''
healthcheck = ''
command = []
args = []
depends_on = []
networks = ['default']
restart_nonce = ''
registry_credential = ''
aws_identity = ''

[services.main.resources]
memory_request = '512Mi'
memory_limit = '768Mi'

[[services.main.mounts]]
volume = 'data'
mount_path = '/data'
read_only = false
sub_path = ''

[[services.main.temporary_mounts]]
mount_path = '/tmp'
size_mib = 32

[services.main.env]
OOS_RUNTIME = 'kubernetes'
OOS_BASE_PATH = '/synehq'
AUTH_URL = 'https://catalog.example.test'
OOS_HAKOPOD_SCOPE = '{{config.scope}}'
OOS_HAKOPOD_KEY_FILE = '/etc/synehq/hakopod.key'
OOS_HAKOPOD_AUTHORITY_URL = '{{config.hakopod-url}}/internal/database-explorer/authorize'

[services.main.files.hakopod-key]
mount_path = '/etc/synehq/hakopod.key'
secret = { ref = 'hakopod-explorer-key' }
mode = 288

[networks]
[networks.default]
internal = false
virtual_network = ''
segment = ''

[volumes]
[volumes.data]
size_gib = 5
storage_class = ''
access_mode = 'ReadWriteOnce'
