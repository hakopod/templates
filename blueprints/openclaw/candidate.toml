[networks]
[networks.default]
internal = false
virtual_network = ''
segment = ''

[volumes]
[volumes.browser-data]
size_gib = 5
storage_class = ''
access_mode = 'ReadWriteOnce'

[volumes.openclaw-data]
size_gib = 5
storage_class = ''
