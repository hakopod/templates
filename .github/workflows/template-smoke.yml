name: Template smoke test
on:
  pull_request:
    paths:
      - blueprints/**
      - catalog.json
      - images.lock.json
      - scripts/smoke_template.py
  push:
    branches: [main]
    paths:
      - blueprints/**
      - catalog.json
      - images.lock.json
      - scripts/smoke_template.py
  workflow_dispatch:
    inputs:
      templates:
        description: Comma-separated template ids (empty = changed templates)
        required: false
        default: ''
permissions:
  contents: read
jobs:
  changed:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: compute
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          INPUT: ${{ inputs.templates }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          catalog = json.load(open("catalog.json"))
          deployable = {r["id"] for r in catalog if r["deployable"]}
          base = os.environ["BASE_SHA"]
          if os.environ["EVENT"] == "workflow_dispatch":
              ids = {i.strip() for i in os.environ["INPUT"].split(",") if i.strip()}
              ids = ids or deployable
          else:
              if not base.strip("0"):  # new branch or first push: no usable base
                  base = "HEAD~1"
              files = subprocess.run(["git", "diff", "--name-only", base, "HEAD"],
                                     capture_output=True, text=True, check=True).stdout.split()
              ids = {f.split("/")[1] for f in files if f.startswith("blueprints/") and f.count("/") >= 2}
              if "catalog.json" in files:  # catalog rows whose entry changed
                  old = subprocess.run(["git", "show", f"{base}:catalog.json"], capture_output=True, text=True)
                  old = {r["id"]: r for r in json.loads(old.stdout)} if old.returncode == 0 else {}
                  ids |= {r["id"] for r in catalog if old.get(r["id"]) != r}
              if "scripts/smoke_template.py" in files:  # script change: canary templates
                  ids |= {"uptime-kuma", "n8n-with-postgres", "freshrss", "directus"}
              # ponytail: images.lock.json changes alone select nothing; add a lock-to-template map if needed.
          ids = sorted(ids & deployable)
          out = json.dumps({"template": ids})
          print(out)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={out}\n")
          PY
  smoke:
    needs: changed
    if: ${{ fromJSON(needs.changed.outputs.matrix).template[0] != null }}
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.changed.outputs.matrix).template }}
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 scripts/smoke_template.py "${{ matrix.template }}"
